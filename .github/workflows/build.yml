---
name: Build Targets

on:
  push:
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - '.gitignore'

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip build]') }}
    name: ${{ matrix.target }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        target:
          - sdrpp-exp

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Build target
        run: |
          ./build.py --target ${{ matrix.target }}

      - name: Generate Xcode project
        run: |
          ./build.py --target ${{ matrix.target }} --xcode

      - name: List files
        if: always()
        run: |
          git status
          ls -lR
...
